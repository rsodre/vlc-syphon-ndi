# Read by apps/scripts/package-macos.sh.
APP_NAME="VLCNDI"
BUNDLE_ID="com.studioavante.vlcndi"
ICON="VLCNDI.icns"
DEFAULT_VIDEO_FILTER="ndi"
# Extra [core] preferences written on first launch (VLC option=value).
# control=syphon:ndi: start the Syphon server / NDI source with the app (fully transparent)
# when their filter is enabled, and keep them up between videos.
# embedded-video=0: play video in its own window, not inside the main (playlist) window.
# macosx-interfacestyle=1: dark interface.
# (VLC finds options by name, so they can all go under [core] here; VLC moves them to
# their own sections when it saves.)
DEFAULT_CORE_OPTIONS=("control=syphon:ndi" "embedded-video=0" "macosx-interfacestyle=1")
DEFAULT_AUDIO_FILTER="ndi"
