# Read by apps/scripts/package-macos.sh.
APP_NAME="VLCSyphon"
BUNDLE_ID="com.studioavante.vlcsyphon"
ICON="VLCSyphon.icns"
DEFAULT_VIDEO_FILTER="syphon"
# Extra [core] preferences written on first launch (VLC option=value).
# play-and-pause: stop on the last frame at the end of a file, so the window, Syphon
# server and NDI source keep showing it instead of closing.
# control=syphon:ndi: start the Syphon server / NDI source with the app (fully transparent)
# when their filter is enabled, and keep them up between videos.
DEFAULT_CORE_OPTIONS=("play-and-pause=1" "control=syphon:ndi")
DEFAULT_AUDIO_FILTER=""
